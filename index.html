<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Beatriz Santana | Portfólio</title>
   <link rel="stylesheet" href="css/style.css">
</head>

<body>
   <header class="top-bar">
      <button class="menu-mobile" id="btn-menu"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#f8f8f2"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
      </button>
      <span class="aba-ativa-mobile">Projetos</span>

      <ul class="menu-desktop">
         <li>Arquivo</li>
         <li>Editar</li>
         <li>Exibir</li>
      </ul>

      <div class="acoes-top">
         <button class="btn-icone"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#f8f8f2"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg></button>
      </div>
   </header>

   <div class="vscode-container"> <!-- escondido mobile -->
      <nav class="activity-bar">
         <!-- icones de gitHub, linkedin...-->
      </nav>

      <aside class="sidebar" id="sidebar">
         <p class="titulo-sidebar">EXPLORADOR</p>
         <!-- lista de arquivos e abas ficarão aqui...-->
      </aside>

      <main class="editor">
         <section class="conteudo-ativo">

            <div class="sintaxe-topo">
               <h1 class="titulo-sessao">Projetos</h1>
               <p class="comentario">// Coisas que construí com base no meu aprendizado</p>
            </div>

            <div class="grid-projetos">
               <article class="card-projeto">
                  <span class="icone-card"></span>
                  <p class="tags-card"><span class="tag-destaque">FRONT-END  • LÓGICA</span></p>
                  <h2>nome do projeto</h2>
                  <p class="descricao-card">explicação do que o projeto faz, qual problema resolve e como foi constrído</p>

                  <div class="tecnologias-card">
                     <span class="tech-badge">HTML5</span>
                     <span class="tech-badge">CSS3</span>
                     <span class="tech-badge">JavaScript</span>
                  </div>
               </article>

            </div>
         </section>

      </main>
   </div>

   <footer class="status-bar">
      <span>⚠ 0 ⊗ 0</span>
      <span>⎇main*🗘</span>
      <span>UTF-8</span>
   </footer>

   <script src="js/script.js"></script>
</body>

</html>
